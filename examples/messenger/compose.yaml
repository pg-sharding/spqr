x-shard: &shard
  image: postgres:16-alpine
  environment:
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  sh1:
    <<: *shard
    volumes: [sh1-data:/var/lib/postgresql/data]
  sh2:
    <<: *shard
    volumes: [sh2-data:/var/lib/postgresql/data]
  router:
    image: pgsharding/spqr-router:nightly-3.2.2-3007-2c9e6b92
    depends_on:
      sh1: {condition: service_healthy}
      sh2: {condition: service_healthy}
    ports:
      - "127.0.0.1:6432:6432"
      - "127.0.0.1:7432:7432"
    environment:
      PGHOST: 127.0.0.1
      PGPORT: "6432"
      PGUSER: postgres
    volumes: [routing:/var/run/spqr]
    configs:
      - source: router
        target: /etc/spqr/router.yaml
    healthcheck:
      test: ["CMD", "psql", "-p", "7432", "-c", "SHOW shards;"]
      interval: 2s
      timeout: 3s
      retries: 30
  load:
    image: postgres:16-alpine
    profiles: [tools]
    depends_on:
      router: {condition: service_healthy}
    environment:
      PGHOST: router
      PGPORT: "6432"
      PGUSER: postgres
    entrypoint: [sh, -ec]
    command:
      - |
        wget -O /tmp/messenger.sql.gz https://storage.yandexcloud.net/spqr-demo-messenger/messenger-small.sql.gz
        gzip -d /tmp/messenger.sql.gz
        psql -X -f /tmp/messenger.sql

configs:
  router:
    content: |
      host: 0.0.0.0
      router_port: "6432"
      admin_console_port: "7432"
      grpc_api_port: "7010"
      unix_socket_dir: /tmp
      router_mode: PROXY
      memqdb_backup_path: /var/run/spqr/metadata.json
      frontend_rules:
        - pool_default: true
          pool_mode: TRANSACTION
          auth_rule: {auth_method: ok}
      backend_rules:
        - pool_default: true
          connection_limit: 10
      schema_cache_backend_rule: {usr: postgres, db: postgres}
      shards:
        sh1: {type: DATA, hosts: ["sh1:5432"]}
        sh2: {type: DATA, hosts: ["sh2:5432"]}

volumes:
  sh1-data:
  sh2-data:
  routing:
