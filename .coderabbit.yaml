# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

tone_instructions: >-
  Be concise and actionable. Focus on correctness, reliability, security,
  concurrency, and meaningful test gaps. Avoid style nitpicks and praise.

reviews:
  profile: chill
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  review_status: false
  review_info: false
  review_details: false
  collapse_walkthrough: true
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: true
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

chat:
  art: false
  auto_reply: false
