name: CREATE KEY RANGE
snippet: key_range_commands
description: |
  This command is used to create a new key range. Since the key space is an ordered set, 
  it is enough to specify only one end of the range.

  The lower bound is inclusive. The upper bound is the next higher lower
  bound in the same distribution, or positive infinity for the highest range.

  When initializing a distribution, create key ranges in descending order
  by lower bound (highest first). A higher bound created after a lower bound
  on another shard is rejected, even when the shards contain no data:
  "key range ... intersects with key range ... in QDB".
  
  For composite sharding keys, specify multiple values separated by commas that correspond 
  to each column in the distribution. Compare bounds lexicographically,
  from left to right, and create the highest bound first.

  For supported distributions, CREATE KEY RANGES FOR DISTRIBUTION handles the
  creation order automatically. To add a boundary within an existing key
  range, use SPLIT KEY RANGE, then REDISTRIBUTE KEY RANGE to move the new
  range's data to another shard if needed.

  Use IF NOT EXISTS to skip creation when the key range already exists.

syntax: |
  CREATE KEY RANGE [IF NOT EXISTS] [ <keyRangeID> ]
    FROM <lowerBound>
    ROUTE TO <shardID> 
    FOR DISTRIBUTION <distributionID>
  
  where lowerBound is a single value or comma-separated values
  for composite keys (e.g., "100, 'value'" for a two-column key)

parameters:
  - name: keyRangeID
    description: Unique identifier for the key range (optional, auto-generated if omitted)
  - name: lowerBound
    description: Lower boundary value (inclusive). Can be integer, string, or comma-separated values for composite keys
  - name: shardID
    description: Target shard ID where data in this range is stored
  - name: distributionID
    description: Distribution ID this key range belongs to

examples:
  - description: Single column key range
    code: CREATE KEY RANGE krid1 FROM 1000 ROUTE TO shard1 FOR DISTRIBUTION ds1;
  - description: Create a key range if it does not exist
    code: |
      CREATE KEY RANGE IF NOT EXISTS krid1 FROM 1000
        ROUTE TO shard1 FOR DISTRIBUTION ds1;
  - description: Composite key range with two integers
    code: CREATE KEY RANGE krid2 FROM 0, 100 ROUTE TO shard2 FOR DISTRIBUTION ds2;
  - description: Composite key range with integer and varchar
    code: |-
      CREATE KEY RANGE krid3 FROM 100, 'aaaaa'
          ROUTE TO shard3 FOR DISTRIBUTION ds3;

tips:
  - Value bounds should be continuous and non-overlapping
  - Use SHOW KEY RANGES to list existing ranges
  - Lock key ranges during maintenance operations with LOCK KEY RANGE
  - Key ranges are immutable once created; use SPLIT or UNITE for modifications
  - Consider boundary values carefully to distribute data evenly

related_commands:
  - SHOW KEY RANGES
  - LOCK KEY RANGE
  - UNLOCK KEY RANGE
  - SPLIT KEY RANGE
  - UNITE KEY RANGE
  - DROP KEY RANGE
