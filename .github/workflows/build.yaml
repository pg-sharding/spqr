name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ^1.26
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi
    - name: build
      run: make build

  planner-perf:
    name: planner performance guard
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ^1.26
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Get dependencies
      run: go get -v -t -d ./...

    - name: Rewrite performance guard
      run: go test -v -run TestCommonValuesRewritePerf ./router/planner/...

    # Reports throughput numbers for the same workload for visibility.
    - name: Benchmarks
      run: go test -run '^$' -bench BenchmarkCommonValuesRewrite -benchmem ./router/planner/...
