name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ^1.26
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi
    - name: build
      run: make build

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ^1.26
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Get dependencies
      run: go get -v -t -d ./...

    - name: Performance guard
      run: go test -v -run TestCommonValuesRewritePerf ./router/planner/...

    - name: Benchmarks
      run: make bench
