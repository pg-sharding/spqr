name: GHCR login
description: Log in to the GitHub Container Registry so prebuilt SPQR images can be pulled.
runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v4.5.2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
