daemonize no
log_format "%p %t %l [%i %s] (%c) %m\n"
log_to_stdout yes
log_session yes
log_config yes

unix_socket_dir "/tmp"
unix_socket_mode "0700"
locks_dir "/tmp/odyssey-xproto"

listen {
	host "127.0.0.1"
	port 6432
}

storage "postgres" {
	type "remote"
	host "127.0.0.1"
	port 5432
}

database "regress" {
	user "regress" {
		authentication "none"
		storage "postgres"
		pool "transaction"
		pool_size 10
		pool_reserve_prepared_statement yes
		client_fwd_error yes
		client_show_id no
	}
}
