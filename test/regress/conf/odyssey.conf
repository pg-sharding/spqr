# Route definition for the odyssey poolers in docker-compose-odyssey.yaml.
#
# The public odyssey image builds its config from environment variables and
# exposes no knob for backend_startup_options, so the regress route is spelled
# out here and pulled in with PRE_INCLUDE_PATH. Being parsed first, this is the
# definition odyssey matches "regress"/"regress" clients against. The storage
# block still comes from the image template, because that is what carries the
# per-container PG_HOST.

database "regress" {
    user "regress" {
        storage "postgres_server"

        # Mirrors the shards' own pg_hba (trust, see
        # docker/shard/pg_hba_test.conf): this suite is about the extra pooler
        # hop, not about a different auth scheme. Requiring a password here
        # would also break schema_cache_backend_rule, which carries no
        # auth_rules in conf/router.yaml.
        authentication "none"

        # The router does its own transaction pooling and relies on a stable
        # backend session (SET, prepared statements, two-phase commit), so
        # odyssey must not multiplex underneath it.
        pool "session"
        pool_size 200
        pool_timeout 30000

        # The router leaves per-shard session state on its backends (search_path
        # among others). Without DISCARD ALL on release that state leaks into
        # the next session on a reused connection.
        pool_discard yes
        pool_rollback yes

        client_fwd_error yes

        # The router delivers the spqrguard GUCs as startup packet parameters
        # (Conn.Auth in pkg/datashard/datashard.go), and odyssey builds its own
        # startup packet for server connections instead of carrying the client's
        # over. Re-declaring them here is what keeps the shards from reporting
        # the guards as "unset". Support for this block landed in odyssey
        # 1cc42b1 "configure mandatory startup parameters for backend
        # connections" (#491), first released in 1.5.0.
        backend_startup_options {
            "spqrguard.prevent_distributed_table_modify" "off"
            "spqrguard.prevent_reference_table_modify" "off"
        }
    }
}
