services:
  shard1:
    image: spqr-shard-image
    environment: &feature-env-common
      POSTGRES_USER: regress
      POSTGRES_DB: regress
      PG_SYNC_REPLICA: true
    ports:
      - "5500:6432"
    hostname: spqr_shard_1
    container_name: spqr_shard_1
    healthcheck: &shard-healthcheck
      test: 'pg_isready -U regress --dbname=regress -p 6432'
      interval: 10s
      timeout: 3s
      retries: 50
    networks:
      - feature_test_network
  shard1-replica:
    image: spqr-shard-image
    environment:
      <<: *feature-env-common
      PG_MASTER: spqr_shard_1
    ports:
      - "5600:6432"
    hostname: spqr_shard_1_replica
    container_name: spqr_shard_1_replica
    healthcheck: 
      <<: *shard-healthcheck
    networks:
      - feature_test_network
  shard2:
    image: spqr-shard-image
    environment:
      <<: *feature-env-common
    ports:
      - "5501:6432"
    hostname: spqr_shard_2
    container_name: spqr_shard_2
    healthcheck: 
      <<: *shard-healthcheck
    networks:
      - feature_test_network
  shard2-replica:
    image: spqr-shard-image
    environment:
      <<: *feature-env-common
      PG_MASTER: spqr_shard_2
    ports:
      - "5601:6432"
    hostname: spqr_shard_2_replica
    container_name: spqr_shard_2_replica
    healthcheck: 
      <<: *shard-healthcheck 
    networks:
      - feature_test_network
  shard3:
    image: spqr-shard-image
    environment:
      <<: *feature-env-common
    ports:
      - "5502:6432"
    hostname: spqr_shard_3
    container_name: spqr_shard_3
    healthcheck: 
      <<: *shard-healthcheck
    networks:
      - feature_test_network
  shard3-replica:
    image: spqr-shard-image
    environment:
      <<: *feature-env-common
      PG_MASTER: spqr_shard_3
    ports:
      - "5602:6432"
    hostname: spqr_shard_3_replica
    container_name: spqr_shard_3_replica
    healthcheck: 
      <<: *shard-healthcheck
    networks:
      - feature_test_network
  router:
    build:
      dockerfile: ./docker/router/Dockerfile
      context: ../../
    ports:
      - "6432:6432"
      - "7432:7432"
      - "7012:7002"
      - "7013:7003"
    environment:
      - ROUTER_CONFIG=${ROUTER_CONFIG:-/spqr/test/feature/conf/router.yaml}
      - ROUTER_LOG=/var/log/spqr-router.log
      - COORDINATOR_CONFIG=${ROUTER_COORDINATOR_CONFIG:-/spqr/test/feature/conf/coordinator.yaml}
    hostname: regress_router
    container_name: regress_router
    depends_on:
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy
      shard1-replica:
        condition: service_healthy
      shard2-replica:
        condition: service_healthy
      shard3:
        condition: service_healthy
      shard3-replica:
        condition: service_healthy
      coordinator:
        condition: service_started
    healthcheck: &router-healthcheck
      test: psql -h regress_router -p 6432 -U regress -d regress
      interval: 10s
      timeout: 3s
      retries: 50
    volumes:
      - keytab:/keytab
      - ./conf/kdc/krb5.conf:/etc/krb5.conf
    networks:
      - feature_test_network
  router2:
    build:
      dockerfile: ./docker/router/Dockerfile
      context: ../../
    ports:
      - "6433:6432"
      - "7433:7432"
      - "7022:7002"
      - "7023:7003"
    environment:
      - ROUTER_CONFIG=${ROUTER_CONFIG:-/spqr/test/feature/conf/router.yaml}
      - ROUTER_LOG=/var/log/spqr-router.log
      - COORDINATOR_CONFIG=${ROUTER_2_COORDINATOR_CONFIG:-/spqr/test/feature/conf/coordinator.yaml}
    hostname: regress_router_2
    container_name: regress_router_2
    depends_on:
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy
      shard1-replica:
        condition: service_healthy
      shard2-replica:
        condition: service_healthy
      shard3:
        condition: service_healthy
      shard3-replica:
        condition: service_healthy
      coordinator:
        condition: service_started
    healthcheck:
      <<: *router-healthcheck
      test: psql -h regress_router_2 -p 6432 -U regress -d regress
    volumes:
      - keytab:/keytab
      - ./conf/kdc/krb5.conf:/etc/krb5.conf
    networks:
      - feature_test_network
  coordinator:
    build:
      dockerfile: ./docker/coordinator/Dockerfile
      context: ../../
    ports:
      - "7002:7002"
      - "7003:7003"
    environment:
      - COORDINATOR_CONFIG=${COORDINATOR_CONFIG:-/spqr/test/feature/conf/coordinator.yaml}
    hostname: regress_coordinator
    container_name: regress_coordinator
    depends_on:
      - "qdb01"
    networks:
      - feature_test_network
  coordinator2:
    build:
      dockerfile: ./docker/coordinator/Dockerfile
      context: ../../
    ports:
      - "7032:7002"
      - "7033:7003"
    environment:
      - COORDINATOR_CONFIG=${COORDINATOR_CONFIG_2:-/spqr/test/feature/conf/coordinator2.yaml}
    hostname: regress_coordinator_2
    container_name: regress_coordinator_2
    depends_on:
      - "router"
      - "router2"
      - "qdb01"
    networks:
      - feature_test_network
  # Odyssey connection pooler in front of the SPQR router, as it is deployed in production.
  # Only started when COMPOSE_PROFILES contains "odyssey", so the default feature test
  # topology is unchanged. The image is a public one and its version is selected by
  # ODYSSEY_IMAGE, which is how the compatibility matrix in CI picks the version to test.
  # The image builds its config from the environment below, so we do not have to maintain
  # a config file per Odyssey version.
  odyssey:
    profiles:
      - odyssey
    image: ${ODYSSEY_IMAGE:-ghcr.io/yandex/odyssey:1.5.1}
    # upstream publishes linux/amd64 only; pinning it keeps the service usable on
    # arm64 development machines through emulation
    platform: ${ODYSSEY_PLATFORM:-linux/amd64}
    ports:
      - "6444:6432"
    environment:
      LISTEN_PORT: 6432
      PG_HOST: regress_router
      PG_PORT: 6432
      DB_NAME: regress
      USER_NAME: regress
      USER_AUTH_TYPE: clear_text
      USER_PASSWORD: 12345678
      POOL_TYPE: ${ODYSSEY_POOL_TYPE:-transaction}
      POOL_SIZE: 20
      # forward SPQR/shard errors to the client verbatim, otherwise error propagation
      # through the pooler cannot be asserted
      CLIENT_FWD_ERROR: "yes"
      LOG_SESSION: "yes"
      LOG_QUERY: "yes"
      LOG_DEBUG: ${ODYSSEY_LOG_DEBUG:-no}
    hostname: regress_odyssey
    container_name: regress_odyssey
    depends_on:
      # only ordering, not readiness: Odyssey binds its listener before it talks to the
      # router and reconnects on its own, and the test harness retries the connection.
      # Waiting for the router to be healthy would break scenarios that deliberately
      # leave the router unhealthy.
      router:
        condition: service_started
    # No healthcheck on purpose: the contents of the Odyssey image differ between the
    # versions under test (1.5.0 is Alpine and ships nc, 1.5.1 is Debian and does not),
    # so readiness is established by the test harness, which retries the connection.
    networks:
      - feature_test_network
  qdb01: #the instance of etcd is hardcoded in feature test
    image: 'quay.io/coreos/etcd:v3.6.4'
    hostname: regress_qdb_0_1
    container_name: regress_qdb_0_1
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_LOG_LEVEL: "debug"
    ports:
      - "2379:2379"
    networks:
      - feature_test_network
    entrypoint: ["/usr/local/bin/etcd", "--advertise-client-urls", "http://regress_qdb_0_1:2379", "--listen-client-urls", "http://0.0.0.0:2379"]
  ldapserver:
    image: "osixia/openldap:1.5.0"
    profiles:
      - auth
    privileged: true
    hostname: regress_ldap_server
    container_name: regress_ldap_server
    environment: &ldap-env
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_DOMAIN: example.com
      LDAP_READONLY_USER: true
      LDAP_READONLY_USER_USERNAME: regress
      LDAP_READONLY_USER_PASSWORD: 12345678
      LDAP_PORT_NUMBER: 389
      LDAP_LDAPS_PORT_NUMBER: 636
    ports:
      - "1389:389"
      - "1636:636"
    healthcheck: &ldap-healthcheck
      test: ldapwhoami -H ldap://127.0.0.1:389 -D "cn=regress,dc=example,dc=com" -w 12345678
      interval: 10s
      timeout: 3s
      retries: 50
    networks:
      - feature_test_network
  ldapserver2:
    image: "osixia/openldap:1.5.0"
    profiles:
      - auth
    privileged: true
    hostname: regress_ldap_server_2
    container_name: regress_ldap_server_2
    environment:
      <<: *ldap-env
    ports:
      - "2389:389"
      - "2636:636"
    healthcheck:
      <<: *ldap-healthcheck
    networks:
      - feature_test_network
  kdc:
    profiles:
      - auth
    build:
      context: ./conf/kdc
    volumes:
      - ./conf/kdc/start.sh:/start.sh
      - keytab:/keytab
    networks:
      - feature_test_network
volumes:
  keytab:
networks:
  feature_test_network:
    name: feature_test_network